<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inno Extension Popup Harness</title>
    <style>
      html { min-height: 100%; background: #dfe2e8; }
      body { margin: 24px !important; box-shadow: 0 12px 40px rgba(20, 24, 35, 0.2); }
    </style>
    <script>
      const storageState = {};
      const storageListeners = new Set();
      window.chrome = {
        runtime: {
          getManifest: () => ({ version: '0.2.0' }),
        },
        storage: {
          sync: {
            get: async (keys) => {
              const result = {};
              for (const key of keys) result[key] = storageState[key];
              return result;
            },
            set: async (values) => {
              const changes = {};
              for (const [key, value] of Object.entries(values)) {
                changes[key] = { oldValue: storageState[key], newValue: value };
                storageState[key] = value;
              }
              for (const listener of storageListeners) listener(changes, 'sync');
            },
          },
          onChanged: {
            addListener: (listener) => storageListeners.add(listener),
          },
        },
        tabs: {
          create: async () => ({}),
        },
      };
    </script>
    <link rel="stylesheet" href="/src/popup/popup.css" />
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
